name: WBC Release Gates

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  integrity-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WBC_QUOTA_ROOT: ${{ github.workspace }}/.wbc-ci-quota
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo mkdir -p "$WBC_QUOTA_ROOT"
      - run: sudo mount -t tmpfs -o size=128m tmpfs "$WBC_QUOTA_ROOT"
      - run: sudo chown "$USER" "$WBC_QUOTA_ROOT"
      - name: Run integrity and stress gates
        run: |
          mkdir -p .wbc-release-report
          set -o pipefail
          pnpm run test:stress 2>&1 | tee .wbc-release-report/stress.log
      - if: always()
        run: |
          uname -a | tee .wbc-release-report/runner.txt
          df -h "$WBC_QUOTA_ROOT" | tee -a .wbc-release-report/runner.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbc-release-integrity-${{ github.run_id }}
          path: .wbc-release-report
          if-no-files-found: warn

  performance-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run performance and endurance gates
        run: |
          mkdir -p .wbc-release-report
          set -o pipefail
          pnpm run test:performance 2>&1 | tee .wbc-release-report/performance.log
          pnpm run test:endurance 2>&1 | tee .wbc-release-report/endurance.log
      - if: always()
        run: |
          uname -a | tee .wbc-release-report/runner.txt
          node --version | tee -a .wbc-release-report/runner.txt
          pnpm --version | tee -a .wbc-release-report/runner.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbc-release-performance-${{ github.run_id }}
          path: .wbc-release-report
          if-no-files-found: warn
